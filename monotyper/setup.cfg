[metadata]
name = trinkets-monotyper
version = 0.1.0
description = A sparse markup compiler for publication-oriented Rocq/Coq comments.
long_description = file: README.md
long_description_content_type = text/markdown
author = Milan Rosko
url = https://github.com/Milan-Rosko/trinkets
project_urls =
    Source = https://github.com/Milan-Rosko/trinkets
keywords = coq, rocq, markup, typesetting
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development :: Documentation
    Topic :: Text Processing :: Markup

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    monotyper = monotyper.main:main
